@let open = mobileOpen();
@let isScrolled = scrolled();

<header
  [ngClass]="{
    'bg-footer/95 shadow-lg backdrop-blur': isScrolled,
    'bg-footer': !isScrolled
  }"
  class="fixed top-0 inset-x-0 z-50 transition-all duration-300"
>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-20">
      <!-- Logo -->
      <a routerLink="/" class="flex items-center gap-2 shrink-0" (click)="closeMobile()">
        <span
          class="w-10 h-10 rounded-lg bg-primary text-footer font-heading font-bold text-xl flex items-center justify-center"
        >
          H
        </span>
        <span class="font-heading text-white text-xl tracking-wide">
          Hra<strong class="text-primary">yfi</strong>
        </span>
      </a>

      <!-- Desktop Nav -->
      <nav class="hidden lg:flex items-center gap-8">
        <a
          routerLink="/"
          routerLinkActive="text-primary"
          [routerLinkActiveOptions]="{ exact: true }"
          class="text-white/80 hover:text-primary transition-colors text-sm font-medium"
          >Accueil</a
        >
        <a
          routerLink="/artisans"
          routerLinkActive="text-primary"
          class="text-white/80 hover:text-primary transition-colors text-sm font-medium"
          >Artisans</a
        >
        <a
          routerLink="/services"
          routerLinkActive="text-primary"
          class="text-white/80 hover:text-primary transition-colors text-sm font-medium"
          >Services</a
        >
        <a
          routerLink="/how-it-works"
          routerLinkActive="text-primary"
          class="text-white/80 hover:text-primary transition-colors text-sm font-medium"
          >Comment ça marche</a
        >
        <a
          routerLink="/contact"
          routerLinkActive="text-primary"
          class="text-white/80 hover:text-primary transition-colors text-sm font-medium"
          >Contact</a
        >
      </nav>

      <!-- CTA -->
      <div class="hidden lg:flex items-center gap-3">
        <a
          routerLink="/login"
          class="text-white/80 hover:text-primary transition-colors text-sm font-medium"
          >Se connecter</a
        >
        <a
          routerLink="/register"
          class="inline-flex items-center gap-2 bg-primary text-footer font-semibold text-sm px-5 py-2.5 rounded-full hover:bg-white transition-colors"
        >
          Commencer
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
          </svg>
        </a>
      </div>

      <!-- Mobile toggle -->
      <button
        type="button"
        (click)="toggleMobile()"
        class="lg:hidden p-2 text-white"
        aria-label="Menu"
      >
        @if (open) {
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        } @else {
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        }
      </button>
    </div>
  </div>

  <!-- Mobile Menu -->
  @if (open) {
    <div class="lg:hidden bg-footer border-t border-white/10">
      <nav class="px-4 py-4 flex flex-col gap-1">
        <a routerLink="/" (click)="closeMobile()" class="text-white/90 hover:text-primary py-2.5 text-sm font-medium">Accueil</a>
        <a routerLink="/artisans" (click)="closeMobile()" class="text-white/90 hover:text-primary py-2.5 text-sm font-medium">Artisans</a>
        <a routerLink="/services" (click)="closeMobile()" class="text-white/90 hover:text-primary py-2.5 text-sm font-medium">Services</a>
        <a routerLink="/how-it-works" (click)="closeMobile()" class="text-white/90 hover:text-primary py-2.5 text-sm font-medium">Comment ça marche</a>
        <a routerLink="/contact" (click)="closeMobile()" class="text-white/90 hover:text-primary py-2.5 text-sm font-medium">Contact</a>
        <div class="h-px bg-white/10 my-2"></div>
        <a routerLink="/login" (click)="closeMobile()" class="text-white/90 hover:text-primary py-2.5 text-sm font-medium">Se connecter</a>
        <a
          routerLink="/register"
          (click)="closeMobile()"
          class="mt-2 inline-flex items-center justify-center gap-2 bg-primary text-footer font-semibold text-sm px-5 py-3 rounded-full"
        >
          Commencer
        </a>
      </nav>
    </div>
  }
</header>

<!-- Spacer so content doesn't hide under fixed header -->
<div class="h-20"></div>
