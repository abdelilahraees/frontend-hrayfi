<section class="bg-white py-20 lg:py-28">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid lg:grid-cols-12 gap-12 lg:gap-16 items-start">
    <div class="lg:col-span-4 lg:sticky lg:top-28">
      <h2 class="text-5xl sm:text-6xl max-w-[12ch]">Vos questions, nos réponses.</h2>
      <p class="mt-6 text-lg text-encre-soft leading-relaxed max-w-[36ch]">
        Pas trouvé ? Notre équipe à Casablanca répond en moins d'une heure, du lundi au samedi.
      </p>
      <a routerLink="/contact" class="btn btn-citron mt-8">Poser ma question</a>
    </div>

    <div class="lg:col-span-8 space-y-3">
      @for (item of items; track item.question; let i = $index) {
        @let isOpen = openIndex() === i;

        <div
          class="rounded-[28px] border-2 transition-colors duration-300"
          [class]="isOpen ? 'bg-menthe-50 border-encre' : 'bg-white border-encre/10 hover:border-encre/30'"
        >
          <h3>
            <button
              type="button"
              (click)="toggle(i)"
              [attr.aria-expanded]="isOpen"
              [attr.aria-controls]="'faq-panel-' + i"
              [id]="'faq-button-' + i"
              class="w-full flex items-center justify-between gap-6 px-6 py-5 text-left font-sans"
            >
              <span class="text-lg lg:text-xl font-bold">{{ item.question }}</span>
              <span
                class="shrink-0 grid place-items-center w-10 h-10 rounded-full border-2 border-encre transition-[transform,background-color] duration-300"
                [class]="isOpen ? 'bg-menthe rotate-45' : 'bg-white'"
                aria-hidden="true"
              >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                  <path stroke-linecap="round" d="M12 5v14M5 12h14" />
                </svg>
              </span>
            </button>
          </h3>

          <div
            [id]="'faq-panel-' + i"
            role="region"
            [attr.aria-labelledby]="'faq-button-' + i"
            class="grid transition-[grid-template-rows] duration-400 ease-out"
            [class.grid-rows-[1fr]]="isOpen"
            [class.grid-rows-[0fr]]="!isOpen"
          >
            <div class="overflow-hidden">
              <p class="px-6 pb-6 pr-16 text-encre-soft text-lg leading-relaxed max-w-[62ch]">{{ item.answer }}</p>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
