<section class="bg-white py-20 lg:py-28">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid lg:grid-cols-12 gap-12 lg:gap-16 items-start">
    <div class="lg:col-span-4 lg:sticky lg:top-28">
      <h2 class="text-4xl sm:text-5xl max-w-[14ch]">Questions fréquentes</h2>
      <p class="mt-6 text-lg text-encre-soft leading-relaxed max-w-[36ch]">
        Pas trouvé ? Notre équipe à Casablanca répond en moins d'une heure, du lundi au samedi.
      </p>
      <a routerLink="/contact" class="btn btn-white mt-8">Poser ma question</a>
    </div>

    <div class="lg:col-span-8 border-t border-encre/15">
      @for (item of items; track item.question; let i = $index) {
        @let isOpen = openIndex() === i;

        <div
          class="border-b border-encre/15"
        >
          <h3>
            <button
              type="button"
              (click)="toggle(i)"
              [attr.aria-expanded]="isOpen"
              [attr.aria-controls]="'faq-panel-' + i"
              [id]="'faq-button-' + i"
              class="w-full flex items-center justify-between gap-6 py-5 text-left font-sans hover:text-menthe-deep transition-colors"
            >
              <span class="text-lg font-semibold">{{ item.question }}</span>
              <span
                class="shrink-0 grid place-items-center w-8 h-8 rounded-full border border-encre/20 transition-transform duration-300"
                [class]="isOpen ? 'rotate-45 bg-menthe-deep border-menthe-deep text-white' : ''"
                aria-hidden="true"
              >
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" d="M12 5v14M5 12h14" />
                </svg>
              </span>
            </button>
          </h3>

          <div
            [id]="'faq-panel-' + i"
            role="region"
            [attr.aria-labelledby]="'faq-button-' + i"
            class="grid transition-[grid-template-rows] duration-400 ease-out"
            [class.grid-rows-[1fr]]="isOpen"
            [class.grid-rows-[0fr]]="!isOpen"
          >
            <div class="overflow-hidden">
              <p class="pb-6 pr-14 text-encre-soft leading-relaxed max-w-[64ch]">{{ item.answer }}</p>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
