<section class="bg-argile-50 py-20 lg:py-28 rounded-[48px] lg:rounded-[80px] mx-2 sm:mx-4">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <!-- Figures as a sentence; the numbers get a lemon highlighter stroke -->
    <p class="font-display font-bold text-3xl sm:text-4xl lg:text-5xl leading-[1.2] max-w-[32ch]">
      <mark class="bg-transparent text-inherit [background:linear-gradient(transparent_55%,var(--color-citron)_55%)] px-1">2&nbsp;500 artisans</mark>
      ont déjà terminé
      <mark class="bg-transparent text-inherit [background:linear-gradient(transparent_55%,var(--color-citron)_55%)] px-1">15&nbsp;000 chantiers</mark>
      chez des familles comme la vôtre.
    </p>

    <!-- Conversation-style reviews -->
    <div class="mt-16 grid lg:grid-cols-2 gap-x-10 gap-y-8">
      @for (t of testimonials; track t.name; let i = $index) {
        <figure class="flex items-end gap-3" [class.lg:mt-16]="i % 2 === 1" [class.flex-row-reverse]="i % 2 === 1">
          <span
            class="shrink-0 grid place-items-center w-12 h-12 rounded-full border-2 border-encre font-display font-bold text-lg pt-0.5"
            [class]="['bg-menthe', 'bg-citron', 'bg-argile', 'bg-white'][i % 4]"
            aria-hidden="true"
          >
            {{ initials(t.name) }}
          </span>
          <div
            class="bg-white border-2 border-encre rounded-[28px] px-6 py-5 shadow-[0_4px_0_var(--color-encre)]"
            [class.rounded-bl-md]="i % 2 === 0"
            [class.rounded-br-md]="i % 2 === 1"
          >
            <blockquote class="text-lg leading-relaxed">{{ t.quote }}</blockquote>
            <figcaption class="mt-3 flex flex-wrap items-center gap-x-3 gap-y-1 text-sm">
              <span class="font-bold">{{ t.name }}</span>
              <span class="text-encre-soft">{{ t.service }} à {{ t.city }}</span>
              <span class="text-[#e9b800]" [attr.aria-label]="t.rating + ' étoiles sur 5'">{{ '★'.repeat(t.rating) }}</span>
            </figcaption>
          </div>
        </figure>
      }
    </div>

    <div class="mt-20 flex flex-col sm:flex-row sm:items-center gap-x-10 gap-y-4">
      <span class="text-sm font-semibold text-encre-soft">Ils ont parlé de Hrayfi</span>
      <div class="flex flex-wrap items-center gap-x-8 gap-y-3 font-display font-bold text-xl text-encre/45">
        <span>TelQuel</span>
        <span>Le Matin</span>
        <span>L'Économiste</span>
        <span>Médias24</span>
        <span>H24</span>
      </div>
    </div>
  </div>
</section>
