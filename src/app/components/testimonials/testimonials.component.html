<section class="bg-chaux py-20 lg:py-28">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="grid lg:grid-cols-12 gap-10 lg:gap-16">
      <div class="lg:col-span-4">
        <h2 class="text-4xl sm:text-5xl">Ce qu'en disent les familles</h2>
        <p class="mt-5 text-lg text-encre-soft leading-relaxed">
          2 500 artisans ont déjà terminé 15 000 chantiers avec Hrayfi, de Tanger à Agadir.
        </p>
      </div>

      <div class="lg:col-span-8 grid sm:grid-cols-2 gap-px bg-encre/10 border border-encre/10 rounded-lg overflow-hidden">
        @for (t of testimonials; track t.name) {
          <figure class="bg-white p-6 sm:p-7 flex flex-col">
            <p class="text-citron tracking-[0.15em]" [attr.aria-label]="t.rating + ' étoiles sur 5'">{{ '★'.repeat(t.rating) }}</p>
            <blockquote class="mt-3 flex-1 text-[17px] leading-relaxed">« {{ t.quote }} »</blockquote>
            <figcaption class="mt-6 flex items-center gap-3">
              <span class="grid place-items-center w-10 h-10 rounded-full bg-menthe-50 text-sm font-semibold text-menthe-deep" aria-hidden="true">{{ initials(t.name) }}</span>
              <span class="text-sm leading-tight">
                <span class="block font-semibold">{{ t.name }}</span>
                <span class="text-encre-soft">{{ t.service }} à {{ t.city }}</span>
              </span>
            </figcaption>
          </figure>
        }
      </div>
    </div>

    <div class="mt-16 pt-8 border-t border-encre/10 flex flex-col sm:flex-row sm:items-center gap-x-10 gap-y-4">
      <span class="text-sm text-encre-soft">Ils ont parlé de Hrayfi</span>
      <div class="flex flex-wrap items-center gap-x-9 gap-y-3 font-display text-xl text-encre/40">
        <span>TelQuel</span>
        <span>Le Matin</span>
        <span>L'Économiste</span>
        <span>Médias24</span>
        <span>H24</span>
      </div>
    </div>
  </div>
</section>
